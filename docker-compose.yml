version: '3.8'

services:
  odoo-db:
    image: postgres:16
    container_name: odoo-db
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo_secure_db_pass
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    networks:
      - nfd-network
    restart: unless-stopped

  odoo19:
    image: odoo:19.0
    container_name: odoo19
    depends_on:
      - odoo-db
    ports:
      - "8069:8069"
    environment:
      - HOST=odoo-db
      - USER=odoo
      - PASSWORD=odoo_secure_db_pass
    volumes:
      - ./nfd_petrosol_demo:/mnt/extra-addons/nfd_petrosol_demo:ro
      - odoo-web-data:/var/lib/odoo
    networks:
      - nfd-network
    restart: unless-stopped

volumes:
  odoo-db-data:
  odoo-web-data:

networks:
  nfd-network:
    driver: bridge
