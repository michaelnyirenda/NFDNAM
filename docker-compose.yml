services:
  nfd-db:
    image: postgres:16
    container_name: nfd-db
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo_secure_db_pass
    volumes:
      - nfd-db-data:/var/lib/postgresql/data
    networks:
      - nfd-network
    restart: unless-stopped

  nfd-odoo19:
    image: odoo:19.0
    container_name: nfd-odoo19
    depends_on:
      - nfd-db
    ports:
      - "8069:8069"
    environment:
      - HOST=nfd-db
      - USER=odoo
      - PASSWORD=odoo_secure_db_pass
    volumes:
      - ./nfd_petrosol_demo:/mnt/extra-addons/nfd_petrosol_demo:ro
      - nfd-odoo-data:/var/lib/odoo
    networks:
      - nfd-network
    restart: unless-stopped

volumes:
  nfd-db-data:
  nfd-odoo-data:

networks:
  nfd-network:
    driver: bridge
